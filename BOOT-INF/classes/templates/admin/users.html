<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('User Management', ~{::content})}">
<body>
<div th:fragment="content">
  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="page-title">User Management</h1>
      <p class="text-muted">Manage system users, credentials, roles, and account statuses.</p>
    </div>
    <button class="btn btn-primary" onclick="document.getElementById('createUserCard').scrollIntoView({behavior: 'smooth'})">
      <i class="bi bi-person-plus"></i> Add New User
    </button>
  </div>

  <!-- Users Table Card -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="card-title"><i class="bi bi-people"></i> Registered Users (<span th:text="${users.size()}">0</span>)</h2>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Roles</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td class="fw-bold" th:text="${u.username}">user1</td>
            <td th:text="${u.firstName + ' ' + u.lastName}">John Doe</td>
            <td th:text="${u.email}">john@example.com</td>
            <td>
              <span th:each="role : ${u.roles}"
                    class="badge me-1"
                    th:classappend="${role == 'ADMIN' ? 'badge-danger' : (role == 'REVIEWER' ? 'badge-warning' : 'badge-primary')}"
                    th:text="${role}">ROLE</span>
            </td>
            <td>
              <span class="badge"
                    th:classappend="${u.enabled ? 'badge-success' : 'badge-neutral'}"
                    th:text="${u.enabled ? 'Active' : 'Disabled'}">Active</span>
            </td>
            <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
            <td>
              <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-sm"
                        th:classappend="${u.enabled ? 'btn-outline-danger' : 'btn-outline-success'}"
                        th:text="${u.enabled ? 'Disable' : 'Enable'}">
                  Toggle
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Create User Card -->
  <div class="card" id="createUserCard">
    <div class="card-header">
      <h2 class="card-title"><i class="bi bi-person-plus-fill"></i> Provision New User</h2>
    </div>
    <div class="card-body">
      <form th:action="@{/admin/users/create}" method="post" th:object="${newUser}">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="username">Username *</label>
            <input type="text" id="username" name="username" th:field="*{username}" class="form-control" required/>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="email">Email *</label>
            <input type="email" id="email" name="email" th:field="*{email}" class="form-control" required/>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="password">Initial Password *</label>
            <input type="password" id="password" name="password" th:field="*{password}" class="form-control" required/>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="firstName">First Name *</label>
            <input type="text" id="firstName" name="firstName" th:field="*{firstName}" class="form-control" required/>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="lastName">Last Name *</label>
            <input type="text" id="lastName" name="lastName" th:field="*{lastName}" class="form-control" required/>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" th:field="*{phone}" class="form-control"/>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="role">Assigned Role *</label>
            <select id="role" name="role" class="form-select" required>
              <option value="POLICYHOLDER">POLICYHOLDER</option>
              <option value="REVIEWER">REVIEWER</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </div>
          <div class="col-12 mt-3 text-end">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle"></i> Create User Account
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
