<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Page Not Found', ~{::content})}">
<body>
<div th:fragment="content">
  <div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
      <div class="card p-5 shadow-sm border-0">
        <div class="mb-4">
          <i class="bi bi-question-circle text-warning" style="font-size: 4rem;"></i>
        </div>
        <h1 class="h3 fw-bold mb-2">404 – Resource Not Found</h1>
        <p class="text-muted mb-4">The page, claim, or resource you are looking for does not exist or may have been relocated.</p>
        <div class="d-flex justify-content-center gap-3">
          <a href="/claims" class="btn btn-primary"><i class="bi bi-house"></i> Return to Claims</a>
          <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Go Back</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
