<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${title} + ' – HealthSure'">HealthSure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <nav class="sidebar" aria-label="Main navigation">
    <div class="sidebar-brand">
      <div class="brand-icon" aria-hidden="true">
        <i class="fas fa-shield-heart" style="color:white;"></i>
      </div>
      <div class="brand-name">HealthSure</div>
      <div class="brand-tagline">Insurance Portal</div>
    </div>

    <div class="sidebar-nav">
      <!-- Common links -->
      <span class="nav-section-label">Main</span>
      <a th:href="@{/claims}" class="nav-link" aria-label="My Claims">
        <span class="nav-icon"><i class="fas fa-file-medical"></i></span>
        <span sec:authorize="hasAnyRole('REVIEWER','ADMIN')">All Claims</span>
        <span sec:authorize="!hasAnyRole('REVIEWER','ADMIN')">My Claims</span>
      </a>

      <!-- Policyholder only -->
      <span class="nav-section-label" sec:authorize="hasRole('POLICYHOLDER') and !hasRole('ADMIN')">Claims</span>
      <a th:href="@{/claims/new}" class="nav-link"
         sec:authorize="hasRole('POLICYHOLDER') and !hasRole('ADMIN')" aria-label="New Claim">
        <span class="nav-icon"><i class="fas fa-plus-circle"></i></span> New Claim
      </a>

      <!-- Reviewer links -->
      <span class="nav-section-label" sec:authorize="hasAnyRole('REVIEWER','ADMIN')">Review</span>
      <a th:href="@{/reviewer/dashboard}" class="nav-link"
         sec:authorize="hasAnyRole('REVIEWER','ADMIN')" aria-label="Reviewer Dashboard">
        <span class="nav-icon"><i class="fas fa-tachometer-alt"></i></span> Dashboard
      </a>
      <a th:href="@{/reviewer/queue}" class="nav-link"
         sec:authorize="hasAnyRole('REVIEWER','ADMIN')" aria-label="Review Queue">
        <span class="nav-icon"><i class="fas fa-tasks"></i></span> Review Queue
      </a>

      <!-- Admin links -->
      <span class="nav-section-label" sec:authorize="hasRole('ADMIN')">Administration</span>
      <a th:href="@{/admin/dashboard}" class="nav-link"
         sec:authorize="hasRole('ADMIN')" aria-label="Admin Dashboard">
        <span class="nav-icon"><i class="fas fa-chart-pie"></i></span> Admin Dashboard
      </a>
      <a th:href="@{/admin/users}" class="nav-link"
         sec:authorize="hasRole('ADMIN')" aria-label="Manage Users">
        <span class="nav-icon"><i class="fas fa-users"></i></span> Users
      </a>
      <a th:href="@{/admin/policies}" class="nav-link"
         sec:authorize="hasRole('ADMIN')" aria-label="Manage Policies">
        <span class="nav-icon"><i class="fas fa-file-contract"></i></span> Policies
      </a>

      <!-- Common bottom links -->
      <span class="nav-section-label">Account</span>
      <a th:href="@{/profile}" class="nav-link" aria-label="Profile">
        <span class="nav-icon"><i class="fas fa-user-circle"></i></span> Profile
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" aria-hidden="true" sec:authorize="isAuthenticated()"
             th:text="${#strings.substring(#authentication.principal.fullName != null and #strings.length(#authentication.principal.fullName) > 0 ? #authentication.principal.fullName : 'U', 0, 1)}">A</div>
        <div class="user-details" sec:authorize="isAuthenticated()">
          <div class="user-name truncate" th:text="${#authentication.principal.fullName}">User Name</div>
          <div class="user-role" sec:authorize="hasRole('ADMIN')">Administrator</div>
          <div class="user-role" sec:authorize="hasRole('REVIEWER') and !hasRole('ADMIN')">Claims Reviewer</div>
          <div class="user-role" sec:authorize="!hasAnyRole('ADMIN','REVIEWER')">Policyholder</div>
        </div>
        <form th:action="@{/logout}" method="post" style="margin:0;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-sm" style="background:transparent;border:none;color:var(--neutral-400);padding:0.25rem;"
                  title="Sign out" aria-label="Sign out">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <header class="top-header">
      <div class="page-title-area">
        <h1 th:text="${title}">Page Title</h1>
      </div>
      <div class="header-actions">
        <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm">
          <i class="fas fa-user"></i>
          <span sec:authorize="isAuthenticated()" th:text="${#authentication.principal.username}">User</span>
        </a>
        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm" title="Sign out of current account">
          <i class="fas fa-sign-out-alt"></i> Sign Out
        </a>
      </div>
    </header>

    <main class="content-area" id="main-content">
      <!-- Flash messages -->
      <div th:if="${success}" class="alert alert-success alert-dismissible" role="alert">
        <i class="fas fa-check-circle"></i>
        <span th:text="${success}"></span>
        <button class="btn btn-sm ms-auto" data-dismiss style="background:none;border:none;cursor:pointer;" aria-label="Close">✕</button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible" role="alert">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${error}"></span>
        <button class="btn btn-sm ms-auto" data-dismiss style="background:none;border:none;cursor:pointer;" aria-label="Close">✕</button>
      </div>
      <div th:if="${warning}" class="alert alert-warning alert-dismissible" role="alert">
        <i class="fas fa-triangle-exclamation"></i>
        <span th:text="${warning}"></span>
        <button class="btn btn-sm ms-auto" data-dismiss style="background:none;border:none;cursor:pointer;" aria-label="Close">✕</button>
      </div>

      <div th:replace="${content}"><!-- content --></div>
    </main>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
