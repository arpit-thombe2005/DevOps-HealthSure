<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('My Profile & Security', ~{::content})}">
<body>
<div th:fragment="content">
  <!-- Page Header -->
  <div class="mb-4">
    <h1 class="page-title">Profile & Account Settings</h1>
    <p class="text-muted">Manage your personal information, contact details, and security credentials.</p>
  </div>

  <div class="row g-4">
    <!-- User Profile Overview -->
    <div class="col-lg-4">
      <div class="card text-center p-4">
        <div class="mx-auto mb-3" style="width: 80px; height: 80px; border-radius: 50%; background: #e0e7ff; color: #4338ca; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700;">
          <span th:text="${#strings.substring(user.firstName, 0, 1) + #strings.substring(user.lastName, 0, 1)}">JD</span>
        </div>
        <h3 class="h5 mb-1" th:text="${user.firstName + ' ' + user.lastName}">John Doe</h3>
        <p class="text-muted small mb-2" th:text="'@' + ${user.username}">@user1</p>
        <div class="mb-3">
          <span th:each="role : ${user.roles}"
                class="badge me-1"
                th:classappend="${role == 'ADMIN' ? 'badge-danger' : (role == 'REVIEWER' ? 'badge-warning' : 'badge-primary')}"
                th:text="${role}">ROLE</span>
        </div>
        <div class="border-top pt-3 text-start small">
          <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <span class="text-muted"><i class="fas fa-envelope me-1"></i> Email</span>
            <span class="text-dark fw-medium text-truncate ms-2" style="max-width: 190px;" th:title="${user.email}" th:text="${user.email}">user@example.com</span>
          </div>
          <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <span class="text-muted"><i class="fas fa-check-circle me-1"></i> Status</span>
            <span class="badge badge-success" th:if="${user.enabled}">Active</span>
            <span class="badge badge-neutral" th:unless="${user.enabled}">Inactive</span>
          </div>
          <div class="d-flex justify-content-between align-items-center py-2">
            <span class="text-muted"><i class="fas fa-calendar-alt me-1"></i> Member Since</span>
            <span class="text-dark fw-medium" th:text="${#temporals.format(user.createdAt, 'MMM yyyy')}">Jan 2026</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Update Profile & Password -->
    <div class="col-lg-8">
      <!-- Edit Profile Card -->
      <div class="card mb-4">
        <div class="card-header">
          <h2 class="card-title"><i class="bi bi-person-gear"></i> Personal Information</h2>
        </div>
        <div class="card-body">
          <form th:action="@{/profile/update}" method="post">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="firstName">First Name *</label>
                <input type="text" id="firstName" name="firstName" th:value="${user.firstName}" class="form-control" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="lastName">Last Name *</label>
                <input type="text" id="lastName" name="lastName" th:value="${user.lastName}" class="form-control" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" th:value="${user.phone}" class="form-control" placeholder="+1-555-0199"/>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="emailReadOnly">Email Address (Immutable)</label>
                <input type="email" id="emailReadOnly" class="form-control" th:value="${user.email}" disabled/>
              </div>
              <div class="col-12">
                <label class="form-label" for="address">Mailing Address</label>
                <textarea id="address" name="address" class="form-control" rows="2" placeholder="Street, City, State, ZIP" th:text="${user.address}"></textarea>
              </div>
              <div class="col-12 text-end">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-save"></i> Save Profile Details
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Change Password Card -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title"><i class="bi bi-shield-lock"></i> Security & Password</h2>
        </div>
        <div class="card-body">
          <form th:action="@{/profile/change-password}" method="post">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label" for="currentPassword">Current Password *</label>
                <input type="password" id="currentPassword" name="currentPassword" class="form-control" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="newPassword">New Password (Min 8 chars) *</label>
                <input type="password" id="newPassword" name="newPassword" class="form-control" minlength="8" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="confirmPassword">Confirm New Password *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" minlength="8" required/>
              </div>
              <div class="col-12 text-end">
                <button type="submit" class="btn btn-warning">
                  <i class="bi bi-key"></i> Update Password
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
