<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('System Error', ~{::content})}">
<body>
<div th:fragment="content">
  <div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
      <div class="card p-5 shadow-sm border-0">
        <div class="mb-4">
          <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
        </div>
        <h1 class="h3 fw-bold mb-2">500 – Unexpected System Error</h1>
        <p class="text-muted mb-4">An internal error occurred while processing your request. Our engineering team has been notified. Please try again later.</p>
        <div class="d-flex justify-content-center gap-3">
          <a href="/claims" class="btn btn-primary"><i class="bi bi-house"></i> Home</a>
          <a href="javascript:location.reload()" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i> Retry</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
