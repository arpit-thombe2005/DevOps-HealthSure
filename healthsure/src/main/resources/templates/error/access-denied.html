<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Access Denied', ~{::content})}">
<body>
<div th:fragment="content">
  <div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
      <div class="card p-5 shadow-sm border-0">
        <div class="mb-4">
          <i class="bi bi-shield-x text-danger" style="font-size: 4rem;"></i>
        </div>
        <h1 class="h3 fw-bold mb-2">403 – Access Denied</h1>
        <p class="text-muted mb-4">You do not have the required permissions to view this resource. Contact your administrator if you believe this is an error.</p>
        <div class="d-flex justify-content-center gap-3">
          <a href="/claims" class="btn btn-primary"><i class="bi bi-house"></i> Go to Dashboard</a>
          <a href="/profile" class="btn btn-outline-secondary"><i class="bi bi-person"></i> View Profile</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
