spring:
  application:
    name: HealthSure-Test
  datasource:
    url: jdbc:h2:mem:healthsure_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

healthsure:
  upload:
    dir: ./target/test-uploads
  seed:
    enabled: false

logging:
  level:
    com.healthsure: WARN
    org.springframework: WARN
    org.hibernate: WARN
